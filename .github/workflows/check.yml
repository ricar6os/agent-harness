name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned OpenSpec CLI
        run: npm install -g "@fission-ai/openspec@$(python3 scripts/check.py --openspec-version)"
      - name: Check the workspace conventions
        run: python3 scripts/check.py --require-tools
      - name: Run the checker tests
        run: python3 -m unittest discover -s tests
