schema: spec-plan

# The generated skills are versioned in this repo so every clone and CI gets the same ones.
skillsScope: project

context: |
  Schema spec-plan: a change has delta specs and one plan.md, nothing else. Never write
  proposal.md, design.md or tasks.md, even where a generic skill lists them as examples.
  Repos: a plan names repos by their repos.json `name`. Resolve each one's checkout and
  verification command as docs/agents/working-on-a-repo.md says (`make repo-check REPO=<name>`).
  Products are optional. When repos.json declares `products`, every change records exactly one
  as `x-product: <slug>` in .openspec.yaml: the user's selection, else the recorded one; if
  neither, list the products from repos.json and ask. Never infer it from code or a Linear
  project name, and announce it. Spec paths then start with the slug
  (`specs/<slug>/<capability>/spec.md`, `openspec/specs/<slug>/<capability>/`), and the change
  touches only that product's repos plus shared ones (entries without `products`). Split work
  spanning products into separate changes. Without `products` in repos.json, changes carry no
  x-product and spec paths start with the capability.

# Linear adapter. Each change is one Linear project, recorded as `x-linear-project: {id, url}`
# in .openspec.yaml; each phase of plan.md is one issue. To work without Linear, delete the
# lines below marked [linear] and the openspec-linear-sync skill.
rules:
  plan:
    - "[linear] After writing or editing plan.md, run openspec-linear-sync. It keeps one issue per phase and writes its id at the end of the phase heading."

operations:
  apply:
    guidance:
      - "[linear] When starting a phase whose heading has an issue id, move that issue to In Progress if it has not started. That is the only Linear status the agent writes."
  archive:
    guidance:
      - "[linear] Before archiving, run openspec-linear-sync and report every phase whose issue is not Done, leaving its status unchanged; the user decides whether to archive anyway."
