schema: spec-plan

# Issue tracker: linear, github or none. With none, plan.md checkboxes are the only tracking.
x-tracker: linear

# What the schema leaves to the workspace: how a repo named in a plan is found, and what a
# change records. The CLI hands this text to every operation.
context: |
  Repos: a plan names repos by their repos.json `name`. Resolve each one's checkout, branch and
  verification command as docs/agents/working-on-a-repo.md says (`make repo-check REPO=<name>`).
  Products are optional. When repos.json declares `products`, every change records exactly one
  as `x-product: <slug>` in .openspec.yaml: the user's selection, else the recorded one; if
  neither, list the products from repos.json and ask. Never infer it from code or a tracker
  project name, and announce it. Spec paths then start with the slug
  (`specs/<slug>/<capability>/spec.md`, `openspec/specs/<slug>/<capability>/`), and the change
  touches only that product's repos plus shared ones (entries without `products`). Split work
  spanning products into separate changes. Without `products` in repos.json, changes carry no
  x-product and spec paths start with the capability.

# Tracker hooks. They apply only when x-tracker is not none, and they are the same for every
# tracker, so switching tracker is that one line.
rules:
  plan:
    - "Unless `x-tracker` at the top of openspec/config.yaml is none, run the openspec-tracker-sync skill after writing or editing plan.md. It keeps one issue per phase and writes its reference at the end of the phase heading."

operations:
  apply:
    guidance:
      - "Unless `x-tracker` in openspec/config.yaml is none: when starting a phase whose heading ends in an issue reference, mark that issue started as the State section of the openspec-tracker-sync skill says. That is the only tracker write apply makes."
  archive:
    guidance:
      - "Unless `x-tracker` in openspec/config.yaml is none: before archiving, run the openspec-tracker-sync skill and report every phase whose issue is not finished, leaving it unchanged; the user decides whether to archive anyway."
